{% extends 'layouts/base.html' %}
{% block title %}Toss{% endblock %}

{% block content %}
<!--<body style="background:#111; color:white; font-family:Arial; padding:20px;">-->

<h1>Match Toss</h1>
<p>{{ team_a }} vs {{ team_b }}</p>

<form method="POST" action="{{ url_for('scoreboard.submit_toss') }}" style="margin-top:20px;">
    <input type="hidden" name="match_id" value="{{ match.id }}">

    <label><strong>Toss Winner:</strong></label><br>
    <input type="radio" name="toss_winner" value="{{ team_a }}" required> {{ team_a }}<br>
    <input type="radio" name="toss_winner" value="{{ team_b }}" required> {{ team_b }}<br><br>

    <label><strong>Decision:</strong></label><br>
    <input type="radio" name="decision" value="bat" required> Bat First<br>
    <input type="radio" name="decision" value="bowl" required> Bowl First<br><br>

    <button class="btn btn-primary">Submit Toss</button>
</form>

{% endblock %}
