{% extends 'layouts/base.html' %}
{% block title %}Assign Player to Season{% endblock %}

{% block content %}
<div class="container col-md-6 my-4">

    <h3 class="mb-3">Assign Player to Season</h3>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Select Season</label>
            <select class="form-select" name="season_id" required>
                {% for s in seasons %}
                <option value="{{ s.id }}">{{ s.year }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Select Player</label>
            <select class="form-select" name="player_id" required>
                {% for p in players %}
                <option value="{{ p.id }}">{{ p.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Select Team (optional)</label>
            <select class="form-select" name="team_id">
                <option value="">Unassigned</option>
                {% for t in teams %}
                <option value="{{ t.id }}">{{ t.name }}</option>
                {% endfor %}
            </select>
        </div>

        <button class="btn btn-primary" type="submit">Assign</button>
        <a href="{{ url_for('players.list_players') }}" class="btn btn-secondary">Back</a>

    </form>

</div>
{% endblock %}
