{% extends 'layouts/base.html' %}
{% block title %}Register for CPL{% endblock %}
{% block content %}
<div class="container my-5">
  <div class="form-wrapper">
    <h1 class="h4 mb-4 text-primary fw-bold">Register</h1>
    <form method="post" enctype="multipart/form-data">
      <div class="row g-4">
        <!-- Name -->
        <div class="col-md-6">
          <label class="form-label fw-semibold">Name</label>
          <input type="text" name="name" class="form-control" placeholder="Enter full name" required>
        </div>

        <!-- Role -->
        <div class="col-md-6">
          <label class="form-label fw-semibold">Role</label>
          <select name="role" class="form-select" required>
            <option value="">Select role</option>
            <option value="Batter">Batter</option>
            <option value="Bowler">Bowler</option>
            <option value="All-rounder">All Rounder</option>
            <option value="WK">Wicket Keeper</option>
          </select>
        </div>

        <!-- Photo -->
        <div class="col-md-6">
          <label class="form-label fw-semibold">Photo</label>
          <input type="file" name="photo" class="form-control">
        </div>

        <!-- Jersey Number -->
        <div class="col-md-3">
          <label class="form-label fw-semibold">Jersey Number</label>
          <input type="number" name="jersey_number" class="form-control" placeholder="e.g. 7">
        </div>

        <!-- Jersey Size -->
        <div class="col-md-3">
          <label class="form-label fw-semibold">Jersey Size</label>
          <select name="jersey_size" class="form-select">
            <option value="">Select size</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>
            <option value="XXXL">XXXL</option>
          </select>
        </div>

        <!-- Hidden Payment Status -->
        <div class="col-md-6 d-none">
          <label class="form-label">Payment Status</label>
          <select name="payment_status" class="form-select">
            <option value="Pending">Pending</option>
            <option value="Paid">Paid</option>
          </select>
        </div>

        <!-- Buttons -->
        <div class="col-12 d-flex justify-content-start gap-3 mt-3">
          <button type="submit" class="btn btn-primary px-4">Preview</button>
          <a href="{{ url_for('main.home') }}" class="btn btn-outline-secondary px-4">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
